---
# Global configuration across all Falcoria cluster hosts

# TLS mode:
# - public: use public ACME certificates for real DNS names.
# - internal: use Caddy's internal CA for private names resolved via /etc/hosts.
falcoria_tls_mode: "public"

# Project domain & Let's Encrypt ACME settings
falcoria_domain: "falcoria.example.com"
acme_email: "admin@example.com"

# Optional: If you don't have public DNS configured for your domain, set the Control Plane's IP here.
# Ansible will automatically populate /etc/hosts on all worker nodes so they can resolve
# ledger.{{ falcoria_domain }} and temporal.{{ falcoria_domain }}.
# Leave empty ("") if you have real DNS records configured.
control_plane_ip: ""

# Container registry and pinned image digests.
# Pinned by content digest, not tag: a tag (even a version tag) can be
# repointed at different image bytes after publish, by mistake or by a
# compromised push credential ("tag confusion") — a digest can't be
# reassigned. falcoria_image_version is a human-readable label only, not
# used in any image: line.
#
# Both are updated automatically: docker-publish.yml builds and pushes on
# every vX.Y.Z tag, then opens a PR here with the new digests and version —
# review and merge that PR, then run the playbooks below. See "Releasing
# images before a deploy" in AGENTS.md.
falcoria_image_registry: "ghcr.io/2s1one"
falcoria_image_version: "0.1.0"
falcoria_image_digests:
  scanledger: "sha256:f374eb49c17a2481ffc49a75e30dbedf4fa975ff481078f00fc0f37569bdb9c3"
  tasker: "sha256:8a07b02f3f541ad7f1f4b105690effb5864f8c2ec57c59cc94548b1108bf87fd"
  worker: "sha256:a813b0e65d7c2064faf3fcccbaddc38ad4c3437aadba576dccba2bc4199b94fe"

# Remote host paths
falcoria_base_dir: "/opt/falcoria"

# System settings
timezone: "UTC"
