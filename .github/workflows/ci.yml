name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pyright

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest -m "not postgres and not temporal"

  ansible-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # vault.yml is gitignored (real secrets, vault-encrypted by the operator);
      # the example file has the same keys with placeholder values, enough for
      # ansible-lint's own per-playbook syntax check to resolve the vars_files
      # reference in CI.
      - run: cp inventory/group_vars/vault.example.yml inventory/group_vars/vault.yml
        working-directory: deploy/ansible
      - name: Cache Ansible collections
        uses: actions/cache@v6
        with:
          path: ~/.ansible/collections
          key: ansible-collections-${{ hashFiles('deploy/ansible/requirements.yml') }}
      - uses: ansible/ansible-lint@v26.8.0
        with:
          working_directory: deploy/ansible
          requirements_file: requirements.yml

  docker-build-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [scanledger, tasker, worker]
    steps:
      - uses: actions/checkout@v7
      - name: Verify Dockerfile builds cleanly
        run: docker build -f apps/${{ matrix.app }}/Dockerfile .
