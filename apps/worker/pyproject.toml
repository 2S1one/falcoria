[project]
name = "falcoria-worker"
version = "0.1.0"
description = "Falcoria nmap scan runner — a stateless Temporal worker."
requires-python = ">=3.12"
dependencies = [
    "falcoria-contracts",
    "falcoria-temporal",
    "falcoria-http",
    "temporalio",
    "httpx",
    "pydantic-settings",
    "defusedxml>=0.7.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/falcoria_worker"]
