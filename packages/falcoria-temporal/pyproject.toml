[project]
name = "falcoria-temporal"
version = "0.1.0"
description = "Shared Temporal SDK glue (pinned data converter, search-attribute keys) for tasker and worker."
requires-python = ">=3.12"
dependencies = ["temporalio[pydantic]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/falcoria_temporal"]
