[project]
name = "falcoria-contracts"
version = "0.1.0"
description = "Shared Pydantic contracts, enums and DTOs for falcoria."
requires-python = ">=3.12"
dependencies = ["pydantic>=2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/falcoria_contracts"]
