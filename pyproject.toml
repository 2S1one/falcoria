# Virtual workspace root — not a package itself.

[tool.uv.workspace]
members = ["packages/*", "apps/*"]

# Workspace-wide source overrides — inherited by every member, so a new app that
# depends on falcoria-contracts / falcoria-temporal needs no [tool.uv.sources]
# table of its own.
[tool.uv.sources]
falcoria-contracts = { workspace = true }
falcoria-temporal = { workspace = true }

[dependency-groups]
dev = [
    "ruff>=0.14,<0.15",
    "pyright>=1.1.400",
    "pytest>=8",
    "anyio>=4",
    "httpx>=0.28.1",
    "uvicorn[standard]>=0.52.4",
]

# ---------------------------------------------------------------------------
# Ruff — see refactor/tooling/ruff-settings.md for the rationale of every line.
# C90 + mccabe.max-complexity are added after the first pass over real code.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations/versions"]
preview = false

[tool.ruff.lint]
select = [
    "F", "E", "W", "I", "UP", "B", "C4", "N", "RUF", "PIE",
    "PGH004", "S", "PTH", "PT", "PLE", "DTZ", "SIM", "TID252", "D",
]
ignore = [
    "E501",                          # wrapping delegated to the formatter
    "SIM108",                        # ternary rewrite often hurts readability
    "COM812", "ISC001",              # conflict with ruff format
    "D100", "D104", "D105", "D106", "D107",  # docstrings: public surface only
]
unfixable = ["F401", "F841"]         # don't let --fix delete work-in-progress

[tool.ruff.lint.per-file-ignores]
"**/tests/**"       = ["S101", "S105", "S106", "D"]
"**/__init__.py"    = ["F401"]
"**/migrations/**"  = ["D"]

[tool.ruff.lint.isort]
known-first-party = [
    "falcoria_contracts",
    "falcoria_scanledger",
    "falcoria_tasker",
    "falcoria_worker",
    "falcli",
]
combine-as-imports = true

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true
skip-magic-trailing-comma = false

# ---------------------------------------------------------------------------
# pyright — standard everywhere; strict for the shared contracts package.
# ---------------------------------------------------------------------------
[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["packages", "apps"]
exclude = ["**/migrations/versions", "**/.venv", "**/__pycache__"]
strict = ["packages/falcoria-contracts/src"]
venvPath = "."          # so an editor's Pyright/Pylance resolves third-party types
venv = ".venv"

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
testpaths = ["packages", "apps"]
